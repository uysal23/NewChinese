name: Generate HSK3-HSK6 Content

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "tools/generate_hsk3_hsk6_content.py"
      - ".github/workflows/generate-hsk3-hsk6-content.yml"

permissions:
  contents: write

concurrency:
  group: newchinese-hsk3-hsk6-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install content generator dependency
        run: python -m pip install "pypinyin>=0.51,<1"

      - name: Generate HSK3-HSK6 content packages
        run: python tools/generate_hsk3_hsk6_content.py

      - name: Verify 300-scene target is physically present
        shell: bash
        run: |
          count=$(find content/hsk[1-6] -mindepth 1 -maxdepth 1 -type d -name 'sc[0-9][0-9][0-9]' | wc -l)
          echo "scene_count=$count"
          test "$count" -eq 300

      - name: Finalize all nonvisual statuses
        run: python tools/finalize_nonvisual_status.py

      - name: Assert 300 scenes and zero missing audio
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          scenes = []
          pending = []
          for h in range(1, 7):
              for n in range(1, 51):
                  d = root / "content" / f"hsk{h}" / f"sc{n:03d}"
                  scenes.append(d)
                  media = json.loads((d / "media_status.json").read_text(encoding="utf-8"))
                  audio = media["audio"]
                  missing = [x for x in audio["required"] if not (d / x).is_file()]
                  if audio["status"] != "complete" or missing:
                      pending.append((f"HSK{h}_SC{n:03d}", audio["status"], missing))
          print("scene_count", len(scenes))
          print("pending_audio", len(pending))
          if len(scenes) != 300 or pending:
              raise SystemExit(f"Nonvisual completion audit failed: {pending[:5]}")
          PY

      - name: Validate content schema and locked rules
        run: python validation/validate_content.py

      - name: Commit generated HSK3-HSK6 content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/hsk3 content/hsk4 content/hsk5 content/hsk6 production_batches
          if git diff --cached --quiet; then
            echo "No generated content changes."
            exit 0
          fi
          git commit -m "feat(content): generate HSK3-HSK6 nonvisual scene content"
          git push origin main
