name: Complete HSK5 SC014 Once

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/complete-hsk5-sc014.yml"
      - "tools/complete_hsk5_sc014.py"

permissions:
  contents: write

concurrency:
  group: newchinese-complete-hsk5-sc014-once
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Complete and validate HSK5 SC014
        run: python tools/complete_hsk5_sc014.py

      - name: Commit SC014 closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NewChinese SC014 automation"
          git config user.email "actions@users.noreply.github.com"
          git add             content/hsk5/sc014/assets/hsk5_sc014_preview.webp             content/hsk5/sc014/visual_manifest.json             content/hsk5/sc014/media_status.json             content/hsk5/sc014/visual_grounding.json             production_batches/HSK5_SC011_SC020.json             MASTER_EXECUTION_STEPS.md
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m "Complete HSK5 SC014 canonical West Lake composite [skip ci]"
          git push origin HEAD:main
