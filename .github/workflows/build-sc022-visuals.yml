name: Build HSK3 SC022 Visuals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-sc022-visuals.yml"
      - "scripts/build_sc022_visuals.py"

permissions:
  contents: write

jobs:
  build-visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/build_sc022_visuals.py
      - name: Commit generated SC022 visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/hsk3/sc022/assets/hsk3_sc022_bg.webp
          git add content/hsk3/sc022/assets/hsk3_sc022_char_zhang_wei.webp
          git add content/hsk3/sc022/assets/hsk3_sc022_char_li_na.webp
          git add content/hsk3/sc022/assets/hsk3_sc022_fg.webp
          git add content/hsk3/sc022/assets/hsk3_sc022_preview.webp
          if git diff --cached --quiet; then
            echo "SC022 visuals unchanged"
          else
            git commit -m "Generate HSK3 SC022 canonical visuals"
            git pull --rebase origin main
            git push
          fi
