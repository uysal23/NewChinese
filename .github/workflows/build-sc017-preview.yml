name: Build HSK3 SC017 Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-sc017-preview.yml"
      - "scripts/build_sc017_preview.py"
      - "content/hsk3/sc017/assets/hsk3_sc017_bg.webp"
      - "content/hsk3/sc017/assets/hsk3_sc017_char_li_na.webp"
      - "content/hsk3/sc017/assets/hsk3_sc017_char_zhang_wei.webp"
      - "content/hsk3/sc017/assets/hsk3_sc017_fg.webp"

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/build_sc017_preview.py
      - name: Commit derived preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/hsk3/sc017/assets/hsk3_sc017_preview.webp
          if git diff --cached --quiet; then
            echo "Preview unchanged"
          else
            git commit -m "Generate HSK3 SC017 preview"
            git pull --rebase origin main
            git push
          fi
