name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - ".github/workflows/build-apk.yml"
      - ".github/workflows/validate-build.yml"
      - ".github/workflows/complete-hsk5-sc014.yml"
      - "tools/complete_hsk5_sc014.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  VOSK_MODEL_URL: https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip
  VOSK_MODEL_DIR: content/models/vosk-model-small-cn-0.22

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare offline Mandarin Vosk model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p content/models
          curl -L --fail --retry 3 --retry-delay 2 "$VOSK_MODEL_URL" -o /tmp/vosk-model-small-cn-0.22.zip
          rm -rf "$VOSK_MODEL_DIR"
          unzip -q /tmp/vosk-model-small-cn-0.22.zip -d content/models
          test -f "$VOSK_MODEL_DIR/am/final.mdl"
          test -f "$VOSK_MODEL_DIR/conf/mfcc.conf"
          echo "Vosk Chinese model packaged at $VOSK_MODEL_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewChinese-main-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
