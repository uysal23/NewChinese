name: SC015 one-shot binary asset import

on:
  push:
    branches: [ main ]
    paths:
      - ".sc015_upload/READY"

permissions:
  contents: write

jobs:
  import-sc015:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct and verify SC015 binary bundle
        run: |
          set -euo pipefail
          cat .sc015_upload/part_*.b64 > /tmp/sc015_bundle.b64
          base64 -d /tmp/sc015_bundle.b64 > /tmp/sc015_bundle.tar.gz
          echo "314db6150a8a4fd48bd6d5a9e5b2401b1de148b777e940b4607fb561f36efd11  /tmp/sc015_bundle.tar.gz" | sha256sum -c -
          mkdir -p /tmp/sc015_extract content/hsk3/sc015/assets
          tar -xzf /tmp/sc015_bundle.tar.gz -C /tmp/sc015_extract
          cp /tmp/sc015_extract/*.webp content/hsk3/sc015/assets/
      - name: Validate WebP integrity and alpha
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("content/hsk3/sc015/assets")
          expected=[
              "hsk3_sc015_bg.webp",
              "hsk3_sc015_char_li_na.webp",
              "hsk3_sc015_char_zhang_wei.webp",
              "hsk3_sc015_fg.webp",
              "hsk3_sc015_preview.webp",
          ]
          for n in expected:
              p=root/n
              assert p.is_file() and p.stat().st_size>10000, (n,"missing/too small")
              im=Image.open(p); im.load()
              assert im.size==(540,960), (n,im.size)
              if n in {"hsk3_sc015_char_li_na.webp","hsk3_sc015_char_zhang_wei.webp","hsk3_sc015_fg.webp"}:
                  assert "A" in im.getbands(), (n,im.mode)
                  lo,hi=im.getchannel("A").getextrema()
                  assert lo<255 and hi>0, (n,lo,hi)
          print("SC015 WebP integrity/alpha gate: PASS")
          PY
      - name: Mark SC015 visual status complete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          vm=Path("content/hsk3/sc015/visual_manifest.json")
          d=json.loads(vm.read_text())
          d["status"]="visual-assets-complete"
          vm.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          ms=Path("content/hsk3/sc015/media_status.json")
          m=json.loads(ms.read_text())
          m["visual"]["status"]="complete"
          m["visual"]["missing"]=[]
          ms.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Run locked content validation
        run: |
          python validation/validate_content.py
          python -m py_compile tools/import_media_assets.py
          git diff --check
      - name: Commit SC015 assets and clean one-shot bridge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .sc015_upload
          rm -f .github/workflows/sc015-one-shot.yml
          git add -A
          git commit -m "Complete HSK3 SC015 visual assets"
          git push origin HEAD:main
