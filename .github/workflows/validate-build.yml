name: Validate and Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - ".github/workflows/build-apk.yml"
      - ".github/workflows/validate-build.yml"
      - ".github/workflows/complete-hsk5-sc005.yml"
      - "tools/complete_hsk5_sc005.py"
  pull_request:

permissions:
  contents: read

concurrency:
  group: newchinese-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate locked manifests and content
        run: python validation/validate_content.py
      - name: Smoke-test media importer
        run: python -m py_compile tools/import_media_assets.py

  test-and-lint:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Android lint
        run: gradle :app:lintDebug

  build-debug:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-approved]'))
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prepare offline Mandarin recognition model
        run: bash tools/prepare_vosk_cn_model.sh
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NewChinese-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  build-release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-approved]'))
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Prepare offline Mandarin recognition model
        run: bash tools/prepare_vosk_cn_model.sh
      - name: Build unsigned release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: NewChinese-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
